<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Services - Helping Hand</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .navbar {
      background-color: #000;
      color: white;
      padding: 15px 0;
    }

    .service-section {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .service-card {
      background-color: #ffffff;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      position: relative;
    }

    .service-card:hover {
      transform: translateY(-3px);
    }

    .service-content {
      flex: 1;
    }

    .service-title {
      font-size: 1.3rem;
      color: #004085;
      margin-bottom: 8px;
    }

    .service-desc {
      font-size: 1rem;
      color: #333;
    }

    .service-status {
      margin-top: 8px;
      font-weight: bold;
    }

    .service-status .active {
      color: green;
    }

    .service-status .inactive {
      color: red;
    }

    .service-requests {
      margin-top: 4px;
      font-style: italic;
      color: #555;
    }

    .request-btn, .ongoing-btn {
      background-color: #28a745;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .request-btn:hover, .ongoing-btn:hover {
      background-color: #218838;
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 100px 20px;
      background-image: url("logo1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .hero > div {
      position: relative;
      z-index: 2;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 40px 60px;
      border-radius: 12px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .hero h2 {
      font-size: 2.5rem;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.1rem;
      color: #eee;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
      <div style="display: flex; align-items: center; gap: 10px;">
        <img src="logo.png" alt="Helping Hand Logo" class="logo-img" />
        <h1 class="logo" style="margin: 0;">Helping Hand</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="emergency.html">Emergency Contacts</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="prepare.html">Preparedness</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="map.html">Live Map</a></li>
        <li><a class="register-btn" href="signin.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero">
    <div>
      <h2>Available Relief Services</h2>
      <p>Explore support options for various emergency scenarios and community protection efforts.</p>
    </div>
  </header>

  <section class="service-section" id="services">
    <!-- Service cards will be rendered here dynamically by JS -->
  </section>

  <footer>
    <p>&copy; 2025 Helping Hand | All rights reserved</p>
  </footer>

  <script>
    const baseCounts = {
      'Flood Report Assistance': 54,
      'Fire Rescue': 39,
      'Wildlife Protection': 24,
      'Hazard Alert': 0
    };

    const services = [
      {
        name: '🌊 Flood Report Assistance',
        desc: 'Access flood monitoring updates, evacuation support, and post-flood rehabilitation resources.',
        status: 'Active'
      },
      {
        name: '🔥 Fire Rescue',
        desc: 'Emergency fire services, safety tips, and firefighting station info.',
        status: 'Active'
      },
      {
        name: '🦓 Wildlife Protection',
        desc: 'Manage wildlife emergencies and human-animal conflict safely and swiftly.',
        status: 'Inactive'
      },
      {
        name: '⚠️ Hazard Alert',
        desc: 'Receive timely alerts for chemical, environmental, and structural hazards.',
        status: 'Active'
      }
    ];

    const allRequests = JSON.parse(localStorage.getItem('submittedRequests') || '[]');
    const requestQueues = {};
    allRequests.forEach(req => {
      if (!requestQueues[req.service]) requestQueues[req.service] = [];
      requestQueues[req.service].push(req);
    });

    const section = document.getElementById("services");

    function handleRequest(serviceName, status) {
      if (status === 'Inactive') {
        alert('Sorry, this service is currently unavailable.');
        return;
      }
      sessionStorage.setItem("selectedService", serviceName);
      window.location.href = "request-service.html";
    }

    services.forEach(service => {
      const base = baseCounts[service.name] || 0;
      const queue = requestQueues[service.name] || [];
      const count = base + queue.length;
      const first = queue[0];

      const card = document.createElement("div");
      card.className = "service-card";
      card.innerHTML = `
        <div class="service-content">
          <div class="service-title">${service.name}</div>
          <div class="service-desc">${service.desc}</div>
          <div class="service-status">Status: <span class="${service.status.toLowerCase()}">${service.status}</span></div>
          <div class="service-requests">Requests: ${count}</div>
        </div>
        <button class="request-btn" onclick="handleRequest('${service.name}', '${service.status}')">Request Service</button>
      `;

      const info = document.createElement('div');
      info.style.marginTop = '10px';
      info.style.fontSize = '0.9rem';
      if (first) {
        info.innerHTML = `
          <strong>Next in Queue:</strong><br/>
          Name: ${first.fullName} <br/>
          Location: ${first.location} <br/>
          Request: ${first.details.slice(0, 60)}...
        `;
      } else {
        info.innerHTML = `<a href='ongoing-requests.html' class='ongoing-btn'>View Ongoing Requests</a>`;
      }
      card.appendChild(info);

      section.appendChild(card);
    });
  </script>
</body>
</html>
