<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Service - Helping Hand</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 80px auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h2 {
      margin-bottom: 20px;
      color: #004085;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 30px;
      cursor: pointer;
    }
    button.submitted {
      background-color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="form-title">Service Request Form</h2>
    <form id="serviceRequestForm">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="location">Location:</label>
      <input type="text" id="location" name="location" required />

      <label for="idType">Type of Government ID:</label>
      <select id="idType" name="idType" required>
        <option value="">Select ID Type</option>
        <option value="Aadhar">Aadhar</option>
        <option value="Passport">Passport</option>
        <option value="Driver's License">Driver's License</option>
        <option value="Voter ID">Voter ID</option>
      </select>

      <label for="idNumber">ID Number:</label>
      <input type="text" id="idNumber" name="idNumber" required />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required />

      <label for="details">Describe Your Need:</label>
      <textarea id="details" name="details" rows="4" required></textarea>

      <button type="submit" id="submitBtn">Request</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('serviceRequestForm');
    const title = document.getElementById('form-title');
    const submitBtn = document.getElementById('submitBtn');
    const service = sessionStorage.getItem('selectedService');

    if (service) {
      title.textContent = `Request for ${service}`;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const location = document.getElementById('location').value;
      const details = document.getElementById('details').value;

      const requestData = {
        service,
        fullName,
        location,
        details,
        timestamp: new Date().toISOString()
      };

      let allRequests = JSON.parse(localStorage.getItem('submittedRequests') || '[]');
      allRequests.push(requestData);
      localStorage.setItem('submittedRequests', JSON.stringify(allRequests));

      let queue = JSON.parse(localStorage.getItem('serviceQueue') || '{}');
      queue[service] = queue[service] ? queue[service] + 1 : 1;
      localStorage.setItem('serviceQueue', JSON.stringify(queue));

      submitBtn.textContent = 'Request Sent';
      submitBtn.classList.add('submitted');
      submitBtn.disabled = true;

      setTimeout(() => {
        alert('Request Sent');
        window.location.href = 'services.html';
      }, 200);
    });
  </script>

</body>
</html>
