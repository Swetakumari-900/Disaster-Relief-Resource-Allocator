<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSA Simulation - Helping Hand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .section {
      margin-bottom: 40px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      margin: 10px 5px;
      padding: 10px 20px;
      border: none;
      background-color: #28a745;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    pre {
      background: #eee;
      padding: 10px;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>DSA Simulations</h1>

  <nav style="text-align:center; margin-bottom: 20px;">
    <a href="index.html">Home</a> |
    <a href="emergency.html">Emergency</a> |
    <a href="services.html">Services</a> |
    <a href="resources.html">Resources</a> |
    <a href="prepare.html">Preparedness</a> |
    <a href="news.html">News</a> |
    <a href="map.html">Live Map</a>
  </nav>

  <div class="section">
    <h2>Queue (Help Requests)</h2>
    <button onclick="enqueueRequest()">Add Request</button>
    <button onclick="dequeueRequest()">Serve Request</button>
    <pre id="queueOutput"></pre>
  </div>

  <div class="section">
    <h2>Stack (Undo Allocations)</h2>
    <button onclick="pushAllocation()">Add Allocation</button>
    <button onclick="popAllocation()">Undo</button>
    <pre id="stackOutput"></pre>
  </div>

  <div class="section">
    <h2>Linked List (Resources Flow)</h2>
    <button onclick="showLinkedList()">Show Flow</button>
    <pre id="linkedListOutput"></pre>
  </div>

  <div class="section">
    <h2>Tree (Relief Zones)</h2>
    <button onclick="showTree()">Show Zones</button>
    <pre id="treeOutput"></pre>
  </div>

  <script>
    class Queue {
      constructor() {
        this.items = [];
      }
      enqueue(item) {
        this.items.push(item);
      }
      dequeue() {
        return this.items.shift();
      }
      display() {
        return this.items.join(' -> ') + (this.items.length ? `\nPending: ${this.items.length}` : '');
      }
    }

    const helpQueue = new Queue();
    let requestId = 1;

    function enqueueRequest() {
      helpQueue.enqueue(`Request ${requestId++}`);
      document.getElementById('queueOutput').textContent = helpQueue.display();
    }

    function dequeueRequest() {
      helpQueue.dequeue();
      document.getElementById('queueOutput').textContent = helpQueue.display();
    }

    class Stack {
      constructor() {
        this.items = [];
      }
      push(item) {
        this.items.push(item);
      }
      pop() {
        return this.items.pop();
      }
      display() {
        return this.items.slice().reverse().join('\n');
      }
    }

    const allocationStack = new Stack();
    let allocationId = 1;

    function pushAllocation() {
      allocationStack.push(`Allocation ${allocationId++}`);
      document.getElementById('stackOutput').textContent = allocationStack.display();
    }

    function popAllocation() {
      allocationStack.pop();
      document.getElementById('stackOutput').textContent = allocationStack.display();
    }

    class Node {
      constructor(data) {
        this.data = data;
        this.next = null;
      }
    }

    class LinkedList {
      constructor() {
        this.head = null;
      }
      append(data) {
        const newNode = new Node(data);
        if (!this.head) {
          this.head = newNode;
          return;
        }
        let current = this.head;
        while (current.next) {
          current = current.next;
        }
        current.next = newNode;
      }
      display() {
        let result = '', current = this.head;
        while (current) {
          result += current.data + ' -> ';
          current = current.next;
        }
        return result + 'null';
      }
    }

    const resourceFlow = new LinkedList();
    resourceFlow.append("Food");
    resourceFlow.append("Water");
    resourceFlow.append("Medical Supplies");

    function showLinkedList() {
      document.getElementById('linkedListOutput').textContent = resourceFlow.display();
    }

    class TreeNode {
      constructor(data) {
        this.data = data;
        this.children = [];
      }
      addChild(node) {
        this.children.push(node);
      }
      display(level = 0) {
        let result = '  '.repeat(level) + '- ' + this.data + '\n';
        for (let child of this.children) {
          result += child.display(level + 1);
        }
        return result;
      }
    }

    const rootZone = new TreeNode("National Relief Center");
    const zoneA = new TreeNode("Zone A");
    const zoneB = new TreeNode("Zone B");
    zoneA.addChild(new TreeNode("Subzone A1"));
    zoneA.addChild(new TreeNode("Subzone A2"));
    zoneB.addChild(new TreeNode("Subzone B1"));
    rootZone.addChild(zoneA);
    rootZone.addChild(zoneB);

    function showTree() {
      document.getElementById('treeOutput').textContent = rootZone.display();
    }
  </script>
</body>
</html>
